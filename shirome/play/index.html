<!DOCTYPE html>
<html lang="ja">
<head><meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
<title>うちの子しろめ</title>
<link rel="icon" href="index.icon.png">
<!-- ⚠️このページは利用者のペット写真を扱う。外部のスクリプト(広告・計測)は読み込まない。写真はページの中だけで使い、どこにも送らない -->
<style>
html, body { margin: 0; padding: 0; border: 0; overflow: hidden; background: #121214; touch-action: none; }
/* ⚠️ canvas は置換要素なので inset:0 だけだと幅が属性値のまま。width/height を明示する */
#canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 1; }
#canvas:focus { outline: none; }
#status { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff; font: 20px sans-serif; z-index: 3; pointer-events: none; }
#pick { position: fixed; left: -9999px; top: 0; width: 1px; height: 1px; opacity: 0; }
/* 写真待ちのあいだだけ出す本物のボタン(label)。ゲーム側から開く input.click() が通らなかったときの保険 = 押せば必ず開く */
#pickBtn { position: fixed; left: 50%; top: 56%; transform: translateX(-50%); z-index: 2; display: none; white-space: nowrap;
  font: 600 18px -apple-system, system-ui, sans-serif; color: #fff; background: #3380e6; border-radius: 12px; padding: 16px 26px; }
</style>
</head>
<body>
<canvas id="canvas">Your browser does not support the canvas tag.</canvas>
<div id="status">…</div>
<input id="pick" type="file" accept="image/*">
<label id="pickBtn" for="pick"></label>
<script src="index.js"></script>
<script>
// 日本語以外のブラウザでは英語(ゲーム本体も navigator.language で切り替える)
const EN = !(navigator.language || 'ja').startsWith('ja');
const L = (ja, en) => EN ? en : ja;
document.documentElement.lang = EN ? 'en' : 'ja';
document.getElementById('status').textContent = L('よみこみ中…', 'Loading…');
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":7222044,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const status = document.getElementById('status');
const engine = new Engine(GODOT_CONFIG);
engine.startGame({
	onProgress: (cur, total) => { if (total > 0) status.textContent = L('よみこみ中… ', 'Loading… ') + Math.round(cur / total * 100) + '%'; },
}).then(() => { status.remove(); }, (err) => { status.textContent = L('エラー: ', 'Error: ') + err; });

// ---------------- 写真の取り込み(このページの中だけ。送信しない)----------------
// 選んだ画像を canvas に描き直して長辺 1280 の JPEG にする(= 向きを直す・EXIF を捨てる・小さくする)。
// Godot は window.shirome.take() を 0.25 秒おきに読みに来る('' = まだ / 'cancel' / 'error' / base64 の JPEG)。
const PHOTO_MAX = 1280;
const pickEl = document.getElementById('pick');
let photo = '';
pickEl.addEventListener('change', async () => {
	const f = pickEl.files && pickEl.files[0];
	pickEl.value = '';
	if (!f) { photo = 'cancel'; return; }
	try {
		const url = URL.createObjectURL(f);
		const img = new Image();
		await new Promise((ok, ng) => { img.onload = ok; img.onerror = ng; img.src = url; });
		const s = Math.min(1, PHOTO_MAX / Math.max(img.naturalWidth, img.naturalHeight));
		const c = document.createElement('canvas');
		c.width = Math.max(1, Math.round(img.naturalWidth * s)); c.height = Math.max(1, Math.round(img.naturalHeight * s));
		const g = c.getContext('2d');
		g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);     // 透明な PNG は白地に
		g.drawImage(img, 0, 0, c.width, c.height);
		URL.revokeObjectURL(url);
		photo = c.toDataURL('image/jpeg', 0.92).split(',')[1];
	} catch (e) { photo = 'error'; }
});
pickEl.addEventListener('cancel', () => { photo = 'cancel'; });
const pickBtn = document.getElementById('pickBtn');
pickBtn.textContent = L('写真をえらぶ', 'Choose a photo');
window.shirome = {
	// ⚠️ファイル選択は「押した直後」でないと開かない。Godot のタップ処理から数コマ以内に呼ぶこと
	pick: () => { photo = ''; pickBtn.style.display = 'block'; try { pickEl.click(); } catch (e) {} return 'ok'; },
	take: () => { const p = photo; photo = ''; if (p) pickBtn.style.display = 'none'; return p; },
	done: () => { pickBtn.style.display = 'none'; return 'ok'; },
};

// ---------------- 見守り: そのあいだだけ画面を消さない + 離れていた(タブが隠れていた)秒を数える ----------------
// wakeLock が無いブラウザでは何もしない。タブを隠すと OS が外すので、戻ったとき(visibilitychange)に取り直す
let wOn = false, wLock = null, wHidAt = 0, wAway = 0, wState = 'off';
const wAcquire = async () => {
	if (!wOn || document.visibilityState !== 'visible') return;
	if (!('wakeLock' in navigator)) { wState = 'unsupported'; return; }
	try {
		const l = await navigator.wakeLock.request('screen');
		if (!wOn) { l.release().catch(() => {}); return; }
		wLock = l; wState = 'held';
	} catch (e) { wState = 'failed'; }
};
document.addEventListener('visibilitychange', () => {
	if (!wOn) return;
	if (document.visibilityState === 'hidden') { wHidAt = performance.now(); return; }
	if (wHidAt) { wAway += performance.now() - wHidAt; wHidAt = 0; }
	wAcquire();
});
window.shiromeWatch = {
	on: () => { wOn = true; wAway = 0; wHidAt = 0; wAcquire(); return 'ok'; },
	off: () => { wOn = false; wState = 'off'; if (wLock) { wLock.release().catch(() => {}); wLock = null; } return 'ok'; },
	away: () => { const a = wAway; wAway = 0; return a / 1000; },      // Godot が 0.3 秒おきに読む(秒。読んだら 0 に戻す)
	lock: () => wState,                                                // 検証用: off / held / failed / unsupported
};

// ---------------- 見守り: 前カメラで「見ている人の顔の位置」だけを取る ----------------
// ⚠️映像はこのページの中だけで使う。送らない・保存しない・画面にも出さない(video 要素は DOM に入れない)。
// 顔検出は同じ場所に置いた MediaPipe(./mp/。外部のサーバーからは読まない)。読めない・カメラを断られたときは 'off' = 今までどおり
let fOn = false, fStream = null, fVideo = null, fDet = null, fPos = 'off', fTimer = 0, fState = 'off';
const fCan = document.createElement('canvas');                       // 映像を小さく描き写す先(DOM には入れない)
const fLoop = () => {
	if (!fOn || !fDet || !fVideo) return;
	try {
		if (fVideo.readyState >= 2 && fVideo.videoWidth) {
			// ⚠️video をそのまま渡すと位置がずれる(headless Chrome で確認)。小さい canvas に描き写してから見つける
			const W = 320, H = Math.max(1, Math.round(320 * fVideo.videoHeight / fVideo.videoWidth));
			if (fCan.width !== W || fCan.height !== H) { fCan.width = W; fCan.height = H; }
			fCan.getContext('2d', { willReadFrequently: true }).drawImage(fVideo, 0, 0, W, H);
			const r = fDet.detect(fCan);
			let best = null;
			for (const d of (r.detections || [])) { const b = d.boundingBox; if (b && (!best || b.width * b.height > best.width * best.height)) best = b; }
			// いちばん大きい顔の中心を ±1 に(映像の右が +x、下が +y)
			fPos = best ? (((best.originX + best.width / 2) / W) * 2 - 1).toFixed(3) + ',' + (((best.originY + best.height / 2) / H) * 2 - 1).toFixed(3) : 'none';
		}
	} catch (e) {}
	fTimer = setTimeout(fLoop, 100);
};
const fStart = async () => {
	try {
		fState = 'loading';
		if (!fDet) {
			const mp = await import('./mp/vision_bundle.mjs');
			const files = await mp.FilesetResolver.forVisionTasks('./mp/wasm');
			fDet = await mp.FaceDetector.createFromOptions(files, { baseOptions: { modelAssetPath: './mp/blaze_face_short_range.tflite' }, runningMode: 'IMAGE' });
		}
		if (!fOn) return;
		const st = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 320 }, height: { ideal: 240 } }, audio: false });
		if (!fOn) { st.getTracks().forEach(t => t.stop()); return; }
		fStream = st;
		fVideo = document.createElement('video');
		fVideo.muted = true; fVideo.playsInline = true; fVideo.srcObject = st;
		await fVideo.play();
		fPos = 'none'; fState = 'on';
		fLoop();
	} catch (e) { fState = 'failed'; fPos = 'off'; }
};
window.shiromeFace = {
	on: () => { if (!fOn) { fOn = true; fStart(); } return 'ok'; },
	off: () => { fOn = false; clearTimeout(fTimer); fPos = 'off'; fState = 'off';
		if (fStream) { fStream.getTracks().forEach(t => t.stop()); fStream = null; }
		if (fVideo) { fVideo.srcObject = null; fVideo = null; } return 'ok'; },
	pos: () => window.__faceFake || fPos,                              // __faceFake は検証用("x,y")
	state: () => fState,                                               // 検証用: off / loading / on / failed
};

// 結果画面の「共有」: 画面を撮り直した画像 1 枚を端末の共有シートへ(使えなければ保存)。元写真そのものは出さない
window.shiromeShare = async (b64, text) => {
	try {
		const bin = atob(b64); const u8 = new Uint8Array(bin.length);
		for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
		const file = new File([u8], 'shirome.png', { type: 'image/png' });
		const save = () => { const a = document.createElement('a'); const url = URL.createObjectURL(file);
			a.href = url; a.download = file.name; document.body.appendChild(a); a.click(); a.remove();
			setTimeout(() => URL.revokeObjectURL(url), 30000); };
		if (navigator.canShare && navigator.canShare({ files: [file] })) {
			// ⚠️やめた(AbortError)は何もしない。それ以外の失敗は黙らず、保存に切り替える
			try { await navigator.share({ files: [file], text }); } catch (e) { if (!e || e.name !== 'AbortError') save(); }
			return;
		}
		save();
	} catch (e) {}
};
</script>
</body>
</html>
