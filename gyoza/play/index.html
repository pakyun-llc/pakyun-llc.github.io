<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2c160e">
<link rel="icon" href="data:,">
<meta name="description" content="開店前の町中華。見習いが 45 秒で、餃子のとじ目に電動ドリルでネジを打って閉める。茹でても開かなかった数だけが今日の品書きに載る。ブラウザでそのまま遊べる無料のゲーム。">
<title>餃子とドリル</title>
<style>
/* 字(すべて SIL OFL 1.1。fonts/LICENSE_*.txt):
   看板・ぴたっ = Potta One(町中華の手描き看板の 丸い筆)/ 画面の字 = Zen Kaku Gothic New(品書きの太いゴシック)/ 壁の短冊だけ = Yuji Syuku(canvas) */
@font-face{font-family:"Potta";src:url("fonts/PottaOne.subset.woff") format("woff");font-weight:400;font-display:block}
@font-face{font-family:"ZenKaku";src:url("fonts/ZenKakuGothicNew-500.subset.woff") format("woff");font-weight:400 500;font-display:block}
@font-face{font-family:"ZenKaku";src:url("fonts/ZenKakuGothicNew-700.subset.woff") format("woff");font-weight:600 700;font-display:block}
@font-face{font-family:"ZenKaku";src:url("fonts/ZenKakuGothicNew-900.subset.woff") format("woff");font-weight:800 900;font-display:block}
@font-face{font-family:"YujiSyuku";src:url("fonts/YujiSyuku.subset.woff") format("woff");font-weight:400;font-display:block}
/* 色は 看板の赤と 紙の白が主役。墨は字だけ */
:root{--ink:#231a14;--paper:#fbf7ef;--red:#c8241b;--red-d:#a01a12;--ui:"ZenKaku","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  --ease-out:cubic-bezier(.23,1,.32,1);--u:1px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#1a0c07;overflow:hidden;overscroll-behavior:none}
body{font-family:var(--ui);font-weight:500;color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
#stage{position:absolute;left:50%;top:0;transform:translateX(-50%);overflow:hidden;background:#3a1a10}
#stage canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#fx{touch-action:none;cursor:pointer}
.txt{position:absolute;left:0;right:0;text-align:center;pointer-events:none}
/* 題名 = 店の看板: 赤い板に 白の手描き文字。板の内側に 白の線 1 本 */
#title{top:calc(var(--u)*120 + env(safe-area-inset-top));transition:opacity 200ms var(--ease-out),transform 200ms var(--ease-out)}
.sign{position:relative;display:table;margin:0 auto;line-height:0}
/* 題名 = 香港の 金漆招牌(黒漆の板に 金箔の 筆の字)。絵 = assets/sign.webp(Grok で 下書きの看板を描き直したもの)。板を 店の壁に掛ける影だけ足す */
#title h1{margin:0;font-size:0;line-height:0}
#title h1 img{display:block;width:calc(var(--u)*820);height:auto;border-radius:calc(var(--u)*3);transform:rotate(-0.8deg);box-shadow:0 calc(var(--u)*3) calc(var(--u)*3) rgba(0,0,0,.55),calc(var(--u)*6) calc(var(--u)*12) calc(var(--u)*14) rgba(0,0,0,.3)}   /* 壁の梁と同じ 少し右上がり。影は 壁に接した 細い影 + 右下へ 短く(Codex) */
#title .en-name{display:none;margin-top:calc(var(--u)*12);font-weight:900;font-size:calc(var(--u)*64);letter-spacing:.02em;color:#fff;text-shadow:0 calc(var(--u)*3) calc(var(--u)*8) rgba(20,4,0,.9)}
#title.en .en-name{display:block}
#title.en #rank{margin-top:calc(var(--u)*36)}
/* 肩書きの札(押すと 工具掛け) */
#rank{pointer-events:auto;display:inline-flex;align-items:baseline;gap:calc(var(--u)*18);margin-top:calc(var(--u)*58);height:auto;padding:calc(var(--u)*18) calc(var(--u)*40) calc(var(--u)*20);
  background:var(--paper);border-radius:calc(var(--u)*6);box-shadow:inset 0 0 0 calc(var(--u)*3) var(--red),0 calc(var(--u)*8) calc(var(--u)*18) rgba(20,4,0,.4)}
#rank .lv{font-weight:700;font-size:calc(var(--u)*34);color:var(--red);letter-spacing:.04em}
#rank .nm{font-weight:900;font-size:calc(var(--u)*58);letter-spacing:.08em}
#rank .go{font-weight:700;font-size:calc(var(--u)*30);opacity:.6}
#title p{margin:calc(var(--u)*12) auto 0;max-width:calc(var(--u)*900);font-weight:700;font-size:calc(var(--u)*40);line-height:1.45;color:#fff;text-shadow:0 calc(var(--u)*2) calc(var(--u)*6) rgba(20,4,0,.85)}
#title.off{opacity:0;transform:translateY(calc(var(--u)*-14));pointer-events:none}
#title.off #rank{pointer-events:none}
#start{position:absolute;left:0;right:0;bottom:calc(var(--u)*110 + env(safe-area-inset-bottom) + var(--gz-ad,0px));display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*26);transition:opacity 200ms var(--ease-out)}
#start .subs{display:flex;gap:calc(var(--u)*22)}
#start.off{opacity:0;pointer-events:none}
#start.off button{pointer-events:none}
/* 話す人の札: 白い短冊。左に 赤で 小さく 話す人、続けて 台詞 */
#boss{top:calc(var(--u)*226 + env(safe-area-inset-top));padding:0 calc(var(--u)*40);opacity:0;transform:translateY(calc(var(--u)*-10));transition:opacity 160ms var(--ease-out),transform 160ms var(--ease-out)}
#boss>span{display:inline-flex;align-items:baseline;gap:calc(var(--u)*20);max-width:100%;text-align:left;padding:calc(var(--u)*24) calc(var(--u)*38);border-radius:calc(var(--u)*6);background:var(--paper);
  box-shadow:0 calc(var(--u)*10) calc(var(--u)*24) rgba(20,4,0,.45)}
#boss b{flex:none;font-weight:900;font-size:calc(var(--u)*34);color:var(--red);letter-spacing:.04em}
#boss i{font-style:normal;font-weight:700;font-size:calc(var(--u)*50);line-height:1.32;word-break:keep-all;text-wrap:balance}
#boss.on{opacity:1;transform:none;transition-duration:220ms}
#hint{bottom:calc(var(--u)*110 + env(safe-area-inset-bottom));padding:0 calc(var(--u)*50);opacity:0;transition:opacity 200ms var(--ease-out)}
#hint span{display:inline-block;font-weight:700;font-size:calc(var(--u)*40);line-height:1.4;text-wrap:balance;color:#fff;padding:calc(var(--u)*14) calc(var(--u)*30);border-radius:calc(var(--u)*6);background:rgba(28,12,6,.72)}
#hint.on{opacity:1}
/* 紙の札(結果・伝票・設定・工具掛け): 白い紙に 赤い帯 1 本 */
.board{position:relative;margin:0 auto;width:calc(var(--u)*900);padding:calc(var(--u)*40) calc(var(--u)*56) calc(var(--u)*40);border-radius:calc(var(--u)*6);background:var(--paper);text-align:left;
  border-top:calc(var(--u)*14) solid var(--red);box-shadow:0 calc(var(--u)*18) calc(var(--u)*44) rgba(20,4,0,.55)}
#result{bottom:calc(var(--u)*50 + env(safe-area-inset-bottom) + var(--gz-ad,0px));opacity:0;visibility:hidden}
#result.on{visibility:visible;opacity:1}
#result .board>*,#r-btns{opacity:0;transform:translateY(calc(var(--u)*16));transition:opacity 260ms var(--ease-out),transform 260ms var(--ease-out)}
#result.on .board>*,#result.on #r-btns{opacity:1;transform:none}
#result.on .board>*:nth-child(2){transition-delay:40ms}#result.on .board>*:nth-child(3){transition-delay:80ms}#result.on .board>*:nth-child(4){transition-delay:110ms}
#result.on .board>*:nth-child(5){transition-delay:140ms}#result.on .board>*:nth-child(6){transition-delay:170ms}#result.on #r-btns{transition-delay:200ms}
#r-head{font-weight:700;font-size:calc(var(--u)*34);color:var(--red);letter-spacing:.08em}
#r-dish{font-weight:900;font-size:calc(var(--u)*76);line-height:1.15;margin-top:calc(var(--u)*6);letter-spacing:.02em}
html[lang=en] #r-dish{font-size:calc(var(--u)*62)}
.rrow{display:flex;align-items:flex-end;gap:calc(var(--u)*28);margin-top:calc(var(--u)*8)}
#r-big{font-weight:900;font-size:calc(var(--u)*184);line-height:.95;font-variant-numeric:tabular-nums;color:var(--red);letter-spacing:-.02em}
#r-big small{font-weight:700;font-size:.3em;margin-left:.08em;color:var(--ink);letter-spacing:0}
#r-big.word{font-size:calc(var(--u)*120);line-height:1.05}
.rside{padding-bottom:calc(var(--u)*18)}
#r-label{font-weight:700;font-size:calc(var(--u)*34);opacity:.7}
#r-rank{font-weight:900;font-size:calc(var(--u)*50);letter-spacing:.06em;margin-top:calc(var(--u)*4)}
#r-rank:empty{display:none}
#r-line{font-weight:700;font-size:calc(var(--u)*44);line-height:1.35;margin-top:calc(var(--u)*18)}
#r-promo{margin-top:calc(var(--u)*18);font-weight:900;font-size:calc(var(--u)*40);color:var(--red)}
#r-promo:empty{display:none}
#r-stat{font-weight:500;font-size:calc(var(--u)*30);margin-top:calc(var(--u)*20);padding-top:calc(var(--u)*16);border-top:calc(var(--u)*2) solid rgba(35,26,20,.14);opacity:.8;font-variant-numeric:tabular-nums}
#r-stat span{white-space:nowrap;margin-right:1.2em}
#r-stat:empty{display:none}
#r-btns{margin-top:calc(var(--u)*28);display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*20);pointer-events:auto}
#r-btns .subs{display:flex;gap:calc(var(--u)*18)}
/* ボタン: 押す物 = 赤地に白 / ほか = 白地に赤 */
button{font:inherit;font-family:var(--ui);font-weight:900;letter-spacing:.04em;color:var(--red);background:var(--paper);border:0;border-radius:calc(var(--u)*10);height:calc(var(--u)*116);padding:0 calc(var(--u)*56);
  font-size:calc(var(--u)*46);box-shadow:inset 0 0 0 calc(var(--u)*4) var(--red),0 calc(var(--u)*6) 0 rgba(20,4,0,.35);
  transition:transform 120ms var(--ease-out),box-shadow 120ms var(--ease-out);touch-action:manipulation;cursor:pointer;pointer-events:auto}
button:active{transform:translateY(calc(var(--u)*4));box-shadow:inset 0 0 0 calc(var(--u)*4) var(--red),0 calc(var(--u)*2) 0 rgba(20,4,0,.35)}
button.main{background:var(--red);color:#fff;min-width:calc(var(--u)*560);box-shadow:0 calc(var(--u)*6) 0 var(--red-d),0 calc(var(--u)*12) calc(var(--u)*24) rgba(20,4,0,.35)}
button.main:active{box-shadow:0 calc(var(--u)*2) 0 var(--red-d),0 calc(var(--u)*6) calc(var(--u)*14) rgba(20,4,0,.35)}
button.sub{height:calc(var(--u)*92);font-size:calc(var(--u)*38);padding:0 calc(var(--u)*38)}
button[hidden]{display:none}
button:focus-visible{outline:calc(var(--u)*6) solid #fff;outline-offset:calc(var(--u)*6)}
/* 伝票(面の前): 白い紙に 赤い罫。何を・何で・どうやって・いくつ */
#card{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:calc(var(--u)*90 + env(safe-area-inset-bottom) + var(--gz-ad,0px));opacity:0;visibility:hidden;
  transition:opacity 220ms var(--ease-out),visibility 0s linear 220ms}
#card.on{opacity:1;visibility:visible;transition:opacity 260ms var(--ease-out)}
#card .board{transform:translateY(calc(var(--u)*30));transition:transform 320ms var(--ease-out)}
#card.on .board{transform:none}
#c-no{font-weight:700;font-size:calc(var(--u)*34);color:var(--red);letter-spacing:.08em}
#c-dish{font-weight:900;font-size:calc(var(--u)*80);line-height:1.12;margin-top:calc(var(--u)*4)}
html[lang=en] #c-dish{font-size:calc(var(--u)*64)}
#c-tool{font-weight:700;font-size:calc(var(--u)*38);margin-top:calc(var(--u)*10)}
#c-tool b{color:var(--red);font-weight:900}
.say{display:flex;gap:calc(var(--u)*18);align-items:baseline;margin-top:calc(var(--u)*26);padding-top:calc(var(--u)*22);border-top:calc(var(--u)*2) solid rgba(200,36,27,.35)}
.say b{flex:none;font-weight:900;font-size:calc(var(--u)*32);color:var(--red)}
.say i{font-style:normal;font-weight:700;font-size:calc(var(--u)*44);line-height:1.38}
#c-how{margin-top:calc(var(--u)*22);font-weight:700;font-size:calc(var(--u)*38);line-height:1.4;padding:calc(var(--u)*18) calc(var(--u)*24);background:rgba(200,36,27,.08);border-radius:calc(var(--u)*6)}
#c-goal{margin-top:calc(var(--u)*16);font-weight:900;font-size:calc(var(--u)*38)}
#c-goal span{color:var(--red)}
#c-btns{margin-top:calc(var(--u)*30);display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*18);pointer-events:auto}
/* 工具掛け(肩書き・集めた工具) */
#board{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(20,6,2,.66);opacity:0;visibility:hidden;
  transition:opacity 200ms var(--ease-out),visibility 0s linear 200ms;touch-action:manipulation}
#board.on{opacity:1;visibility:visible;transition:opacity 220ms var(--ease-out)}
#board .board{width:calc(var(--u)*980);padding:calc(var(--u)*30) calc(var(--u)*40) calc(var(--u)*36);text-align:center}
#b-title{display:flex;justify-content:space-between;align-items:baseline}
#b-title b{font-weight:900;font-size:calc(var(--u)*56)}
#b-title span{font-weight:700;font-size:calc(var(--u)*34);color:var(--red)}
#ladder{display:flex;justify-content:space-between;margin:calc(var(--u)*18) 0 calc(var(--u)*14);font-weight:700;font-size:calc(var(--u)*24);letter-spacing:-.02em;white-space:nowrap}
#ladder span{flex:1;padding:calc(var(--u)*10) 0;border-bottom:calc(var(--u)*6) solid rgba(35,26,20,.12);color:rgba(35,26,20,.42)}
#ladder span.got{border-color:var(--red);color:var(--ink)}
#ladder span.now{color:var(--red);font-weight:900}
html[lang=en] #ladder{font-size:calc(var(--u)*19);white-space:normal;line-height:1.1;letter-spacing:0}
html[lang=en] #ladder span{padding:calc(var(--u)*6) calc(var(--u)*3)}
#peg{position:relative;width:100%;height:calc(var(--u)*900);margin-top:calc(var(--u)*8)}
#peg canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:calc(var(--u)*4)}
#b-title span.flip{animation:flip 520ms var(--ease-out)}
@keyframes flip{0%{transform:rotateX(90deg);opacity:.2}60%{transform:rotateX(-12deg);opacity:1}100%{transform:none}}
#b-title span{display:inline-block}
#b-note{font-weight:700;font-size:calc(var(--u)*32);margin-top:calc(var(--u)*18);opacity:.7;min-height:1.4em}
#b-btns{margin-top:calc(var(--u)*22);display:flex;justify-content:center;gap:calc(var(--u)*18)}
/* 設定 */
#set{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(20,6,2,.55);opacity:0;visibility:hidden;
  transition:opacity 200ms var(--ease-out),visibility 0s linear 200ms;touch-action:manipulation}
#set.on{opacity:1;visibility:visible;transition:opacity 220ms var(--ease-out)}
.panel{position:relative;width:calc(var(--u)*940);max-height:94%;overflow:auto;border-radius:calc(var(--u)*6);padding:calc(var(--u)*20) calc(var(--u)*50) calc(var(--u)*44);background:var(--paper);
  border-top:calc(var(--u)*14) solid var(--red);box-shadow:0 calc(var(--u)*24) calc(var(--u)*60) rgba(0,0,0,.6);transform:scale(.96) translateY(calc(var(--u)*12));transition:transform 200ms var(--ease-out)}
#set.on .panel{transform:none;transition-duration:240ms}
.panel h2{margin:calc(var(--u)*24) 0 calc(var(--u)*10);font-weight:900;font-size:calc(var(--u)*60);letter-spacing:.2em;text-align:center}
html[lang=en] .panel h2{letter-spacing:.04em}
.row{display:flex;align-items:center;justify-content:space-between;gap:calc(var(--u)*20);padding:calc(var(--u)*24) 0;border-bottom:calc(var(--u)*2) solid rgba(35,26,20,.1)}
.row .lab{font-weight:900;font-size:calc(var(--u)*44);white-space:nowrap}
.row .cap{flex-basis:100%;font-weight:500;font-size:calc(var(--u)*32);opacity:.75;margin-top:calc(var(--u)*-6)}
.row.wrap{flex-wrap:wrap}
.seg{display:flex;gap:calc(var(--u)*12)}
.seg button{white-space:nowrap;height:calc(var(--u)*100);min-width:calc(var(--u)*130);padding:0 calc(var(--u)*26);font-size:calc(var(--u)*40);font-weight:700;color:var(--ink);box-shadow:inset 0 0 0 calc(var(--u)*3) rgba(200,36,27,.45)}
.seg button:active{box-shadow:inset 0 0 0 calc(var(--u)*3) rgba(200,36,27,.45)}
.seg button[aria-pressed="true"]{background:var(--red);color:#fff;font-weight:900;box-shadow:none}
#s-close{display:block;margin:calc(var(--u)*36) auto 0;min-width:calc(var(--u)*360)}
@media (prefers-reduced-motion:reduce){#title,#boss,#result .board>*,#r-btns,.panel,#set,#card,#card .board,#board{transition-duration:1ms}}
</style>

</head>
<body>
<div id="stage">
  <canvas id="bg"></canvas><canvas id="fx"></canvas>
  <div id="title" class="txt"><div class="sign"><h1><img src="assets/sign.webp" alt="餃子とドリル" width="960" height="720"></h1></div><div class="en-name">Dumplings &amp; Drill</div><button id="rank" type="button"><span class="lv"></span><span class="nm"></span><span class="go"></span></button><p></p></div>
  <div id="boss" class="txt"><span><b></b><i></i></span></div>
  <div id="hint" class="txt"><span></span></div>
  <div id="start"><button id="b-in" class="main"></button><div class="subs"><button id="b-board" class="sub"></button><button id="b-set" class="sub"></button></div></div>
  <div id="card"><div class="board"><div id="c-no"></div><div id="c-dish"></div><div id="c-tool"></div><div class="say"><b id="c-who"></b><i id="c-line"></i></div><div id="c-how"></div><div id="c-goal"></div>
    <div id="c-btns"><button id="c-go" class="main"></button><button id="c-back" class="sub"></button></div></div></div>
  <div id="result" class="txt"><div class="board"><div id="r-head"></div><div id="r-dish"></div><div class="rrow"><div id="r-big"></div><div class="rside"><div id="r-label"></div><div id="r-rank"></div></div></div><div id="r-line"></div><div id="r-promo"></div><div id="r-stat"></div></div>
    <div id="r-btns"><button id="b-next" class="main"></button><div class="subs"><button id="b-again" class="sub"></button><button id="b-board2" class="sub"></button><button id="b-share" class="sub"></button></div></div></div>
  <div id="board" role="dialog" aria-modal="true" aria-labelledby="b-title"><div class="board"><div id="b-title"><b></b><span></span></div><div id="ladder"></div><div id="peg"><canvas id="pegc"></canvas></div><div id="b-note"></div>
    <div id="b-btns"><button id="b-play" class="main"></button><button id="b-close" class="sub"></button></div></div></div>
  <div id="set" role="dialog" aria-modal="true" aria-labelledby="s-title"><div class="panel"><h2 id="s-title"></h2><div id="s-rows"></div><button id="s-close" class="main"></button></div></div>
</div>
<script src="js/game.js"></script>
<script src="js/tools.js"></script>
<script src="js/main.js"></script>
</body>
</html>
