<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:,">
<title>顔芸(試作)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap" rel="stylesheet">
<style>
  /* ミーム動画の字幕の作法: 太い白字に黒いふち。色は白と黒だけ */
  :root { --white: #fff; --black: #000; --display: "Dela Gothic One", "Hiragino Sans", "Noto Sans JP", sans-serif; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--black); color: var(--white); overflow: hidden;
    font-family: "Hiragino Sans", "Noto Sans JP", sans-serif; font-weight: 600; touch-action: manipulation;
    -webkit-user-select: none; user-select: none; }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  video, #probe { display: none; }
  .meme { font-family: var(--display); font-weight: 400; color: var(--white); -webkit-text-stroke: 7px var(--black); paint-order: stroke fill; line-height: 1.2; }

  #start { position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: flex-end;
    padding: 0 22px calc(36px + env(safe-area-inset-bottom)); }
  #start h1 { font-family: var(--display); font-weight: 400; font-size: clamp(54px, 17vw, 76px); line-height: 1.08; margin: 0 0 20px; }
  #start p { font-size: 16px; line-height: 1.75; margin: 0 0 30px; max-width: 21em; }
  #go { font-family: var(--display); font-size: 21px; color: var(--black); background: var(--white); border: 0;
    border-radius: 6px; height: 62px; width: 100%; max-width: 360px; transition: transform 120ms ease-out; }
  #go:active { transform: scale(.97); }
  #go[disabled] { opacity: .5; }
  #msg { min-height: 1.8em; margin-top: 14px; font-size: 14px; }

  #hud { position: fixed; inset: 0; display: none; pointer-events: none; text-align: center; }
  #hint { position: absolute; left: 16px; right: 16px; top: calc(20px + env(safe-area-inset-top)); font-size: 26px; -webkit-text-stroke-width: 6px; }
  #cap { position: absolute; left: 12px; right: 12px; bottom: calc(34px + env(safe-area-inset-bottom)); font-size: clamp(34px, 10.5vw, 46px); white-space: pre-line; }
  #kdebug { position: absolute; left: 8px; top: 90px; text-align: left; font: 11px/1.35 ui-monospace, monospace; white-space: pre; display: none; text-shadow: 0 0 3px #000, 0 0 3px #000; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<video id="cam" playsinline muted autoplay></video>
<canvas id="probe" width="144" height="192"></canvas>

<div id="start">
  <h1>顔で<br>鳴らす</h1>
  <p>眉、口、目、首。顔を動かすと、顔が変な形になって音が出ます。映像はこの端末の中だけで使い、どこにも送りません。</p>
  <button id="go">カメラをつける</button>
  <div id="msg"></div>
</div>

<div id="hud">
  <div id="hint" class="meme"></div>
  <div id="cap" class="meme" aria-live="polite"></div>
  <div id="kdebug"></div>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
